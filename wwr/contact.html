<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Contact White Water Rafting Company for reservations, questions, and suggestions.">

    <meta name="author" content="Eruba Kingsley Ositadinma">

    <link rel="stylesheet" href="styles/rafting.css">

    <title>Contact Us | White Water Rafting</title>

</head>

<body>

```

<header>

    <img src="images/z-wwr-oars.png" alt="White Water Rafting logo">

    <nav>

        <ul>

            <li><a href="index.html">Home</a></li>

            <li><a href="about.html">About Us</a></li>

            <li><a href="trips.html">Trips</a></li>

            <li><a href="contact.html">Contact Us</a></li>

        </ul>

    </nav>

</header>

<main>

    <!-- Company Information -->

    <section class="contact-info">

        <h1>White Water Rafting Company</h1>

        <p>

            <strong>123 Main River Street</strong><br>

            Kolob, California<br>

            <strong>+1 999 999 9999</strong><br>

            info@whitewater.com

        </p>

    </section>

    <!-- Map and Contact Form -->

    <section class="contact-section">

        <div class="map">

            <iframe

                src="https://www.google.com/maps?q=123+Main+River+Street,+Kolob,+California&output=embed"

                width="100%"

                height="100%"

                loading="lazy"

                title="White Water Rafting Company location map"

                allowfullscreen

                referrerpolicy="no-referrer-when-downgrade">

            </iframe>

        </div>

        <form>

            <!-- Name -->

            <div class="form-row">

                <label for="name">Name</label>

                <input

                    type="text"

                    id="name"

                    name="name"

                    placeholder="Enter your name"

                    required>

            </div>

            <!-- Email -->

            <div class="form-row">

                <label for="email">Email</label>

                <input

                    type="email"

                    id="email"

                    name="email"

                    placeholder="Enter your email"

                    required>

            </div>

            <!-- Purpose -->

            <fieldset>

                <legend>Purpose</legend>

                <label for="general">

                    <input

                        type="radio"

                        id="general"

                        name="purpose"

                        value="general"

                        checked>

                    General Inquiry

                </label>

                <label for="reservation">

                    <input

                        type="radio"

                        id="reservation"

                        name="purpose"

                        value="reservation">

                    Reservation Question

                </label>

                <label for="suggestion">

                    <input

                        type="radio"

                        id="suggestion"

                        name="purpose"

                        value="suggestion">

                    Website Suggestion

                </label>

            </fieldset>

            <!-- Message -->

            <div class="form-row">

                <label for="message">Message</label>

                <textarea

                    id="message"

                    name="message"

                    placeholder="Type your message here"

                    required></textarea>

            </div>

            <!-- Newsletter -->

            <label for="subscribe" class="subscribe">

                <input

                    type="checkbox"

                    id="subscribe"

                    name="subscribe">

                Please subscribe me to the monthly newsletter

            </label>

            <!-- Submit Button -->

            <button type="submit">Send Message</button>

        </form>

    </section>

    <!-- Employee Profiles -->

    <section class="employees">

        <h2>We Are Here to Serve You</h2>

        <div class="employee-container">

            <!-- Employee 1 -->

            <figure class="employee">

                <img

                    src="images/employee1_optimized_50.jpg"

                    alt="White water rafting guide(staff)">

                <figcaption>

                    <strong>James Wilson</strong><br>

                    Rafting Guide

                </figcaption>

            </figure>

            <!-- Employee 2 -->

            <figure class="employee">

                <img

                    src="images/employee2_optimized_50.jpg"

                    alt="White water rafting safety coordinator(staff)">

                <figcaption>

                    <strong>Sarah Johnson</strong><br>

                    Safety Coordinator

                </figcaption>

            </figure>

            <!-- Employee 3 -->

            <figure class="employee">

                <img

                    src="images/employee3_optimized_50.jpg"

                    alt="White water rafting customer service manager">

                <figcaption>

                    <strong>Michael Brown</strong><br>

                    Customer Service Manager

                </figcaption>

            </figure>

        </div>

    </section>

</main>

<footer>

    <p>

        © 2026 White Water Rafting.

        Eruba Kingsley Ositadinma.

    </p>

    <nav class="socialmedia">

        <a href="https://www.facebook.com/">

            <img

                src="images/facebook_4922978.png"

                alt="Facebook">

        </a>

        <a href="https://www.instagram.com/">

            <img

                src="images/instagram_2111421.png"

                alt="Instagram">

        </a>

        <a href="https://www.linkedin.com/">

            <img

                src="images/social_12942307.png"

                alt="LinkedIn">

        </a>

    </nav>

</footer>
