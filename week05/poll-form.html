<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form - User Poll</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>

    <h1>WDD 130 | HTML Form - User Poll</h1>

    <main>
        <form>

            <fieldset>
                <legend>Contact Information</legend>

                <div class="form-row">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname">
                </div>

                <div class="form-row">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">
                </div>

            </fieldset>

            <fieldset>
                <legend>Questions</legend>

                <div class="form-row">
                    <label for="browser">
                        What is your favorite internet browser?
                    </label>

                    <select id="browser" name="browser">
                        <option value="chrome">Chrome</option>
                        <option value="firefox">Firefox</option>
                        <option value="edge">Edge</option>
                        <option value="safari">Safari</option>
                    </select>
                </div>

                <div class="form-row checkbox-row">
                    <label for="pet">Do you have a household pet?</label>
                    <input type="checkbox" id="pet" name="pet">
                </div>

                <div class="places">
                    <label for="places">List the places you have lived:</label>

                    <textarea id="places" name="places"
                        placeholder="Stillwater Florida, Amsterdam Netherlands, Tibuktu Mali"></textarea>
                </div>

            </fieldset>

            <button type="submit">Submit Poll</button>

        </form>
    </main>

    <footer>
        ©2026 | HTML Form - User Poll Activity | Eruba Kingsley Ositadinma
    </footer>

</body>
</html>
